<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="check-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#primary-grad)" filter="url(#shadow)" />
  
  <!-- Inner Ring / Progress Accent -->
  <circle cx="32" cy="32" r="22" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4" fill="none" />
  
  <!-- Flame / Check Symbol -->
  <path d="M22 33L28 39L42 23" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Streak Flame Sparkle -->
  <circle cx="44" cy="18" r="3.5" fill="#F59E0B" />
</svg>
